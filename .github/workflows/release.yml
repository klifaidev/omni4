name: Release OMNI4

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build e publicar
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          EP_DRAFT: false
          EP_PRE_RELEASE: false
        run: npm run electron:publish

      - name: Verificar assets da release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "omni4-release-check"
          }
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$env:TAG_NAME" `
            -Headers $headers
          if ($release.draft -eq $true) {
            throw "Release $env:TAG_NAME foi publicada como draft."
          }
          if ($release.prerelease -eq $true) {
            throw "Release $env:TAG_NAME foi publicada como pre-release."
          }
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          if ($assetNames -notcontains "latest.yml") {
            throw "Release $env:TAG_NAME sem latest.yml. Assets encontrados: $($assetNames -join ', ')"
          }
          $installer = $assetNames | Where-Object { $_ -like "OMNI4-Pricing-Analytics-Setup-*.exe" } | Select-Object -First 1
          if (-not $installer) {
            throw "Release $env:TAG_NAME sem instalador .exe. Assets encontrados: $($assetNames -join ', ')"
          }
          Write-Host "Release $env:TAG_NAME validada com latest.yml e instalador $installer."
