    <meta name="theme-color" content="#0a0d1c">
    <!--
      Content-Security-Policy: defesa em profundidade. O app roda 100% local
      (sem chamadas de rede do renderer, sem fontes/scripts externos — auto-
      update e IPC de arquivos ficam no processo principal do Electron, fora
      do alcance desta politica). Isso nao substitui corrigir uma falha de
      XSS caso uma apareca, mas limita bastante o dano possivel enquanto nao
      existir uma: bloqueia script inline/externo, conexao de rede a
      qualquer host que nao seja o proprio app, e plugins/objetos embutidos.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws:; object-src 'none'; base-uri 'self'; form-action 'self';">

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
